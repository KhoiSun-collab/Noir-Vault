<style>

 $("#ph").textContent=showFav?"Favourites":"The collection";$("#pg").innerHTML=l.length?l.map(({x,i})=>`<div class="pc glass"><div class="pic"><button class="hb${fav.has(i)?" on":""}" data-f="${i}" aria-label="Favourite">${ic("heart",fav.has(i)?"fill":"")}</button>${x.e}</div><h3>${x.n}</h3><div class="old">${R(x.o)}</div><div class="price">${R(x.p)}</div><button class="add" data-i="${i}">Add to bag</button></div>`).join(""):'<div class="none">'+(showFav?"No favourites yet. Tap the heart on a product to save it.":"Nothing found.")+'</div>'}

async function pack(prod){
 const ov=document.createElement("div");ov.className="ov";
 ov.innerHTML=`<div class="boxw"><div class="it">${prod.e}</div><div class="body"><div class="tape"></div><div class="lbl">VELOX</div></div><div class="fl l"></div><div class="fl r"></div></div>`;
 document.body.appendChild(ov);const bw=ov.firstChild;
 bw.animate([{transform:"scale(0)",opacity:0},{transform:"scale(1)",opacity:1}],{duration:300,easing:"cubic-bezier(.3,1.5,.5,1)"});
 await sleep(350);
 await bw.querySelector(".it").animate([{transform:"translateY(-130px) rotate(-15deg)"},{transform:"translateY(26px) rotate(0)"}],{duration:550,easing:"ease-in",fill:"forwards"}).finished;
 bw.classList.add("closed");await sleep(450);
 bw.classList.add("sealed");await sleep(450);
 const a=bw.getBoundingClientRect(),c=($("#dcart")&&$("#pd.on")?$("#dcart"):$("#cartBtn")).getBoundingClientRect();
 const dx=c.left+c.width/2-(a.left+a.width/2),dy=c.top+c.height/2-(a.top+a.height/2);
 ov.animate([{opacity:1},{opacity:0}],{duration:650,fill:"forwards"});
 await bw.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate(0,-40px) scale(1.1)",offset:.25},{transform:`translate(${dx}px,${dy}px) scale(.15)`,opacity:.6}],{duration:650,easing:"ease-in-out"}).finished;
 ov.remove();cart.push({id:++uid,...prod});render();
 const b=$("#cartBtn");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
}

 $("#tot").textContent=R(cart.reduce((s,x)=>s+x.p,0));$("#badge").textContent=cart.length;$("#checkout").disabled=!cart.length}

$("#topDrawer").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;
 document.querySelectorAll("#topDrawer [data-k]").forEach(x=>x.classList.toggle("on",x==b));
 $("#q").value=k=="all"?"":k;grid(k=="all"?"":k.toLowerCase());tp(false);setTimeout(()=>$("#pg").scrollIntoView({behavior:"smooth"}),250)};
$("#items").onclick=e=>{const b=e.target.closest(".rm");if(b){cart=cart.filter(x=>x.id!=b.dataset.id);render()}};

const tabs=[...document.querySelectorAll("#dk button")],setOn=a=>tabs.forEach(b=>b.classList.toggle("on",b.dataset.a==a));

 if(a=="shop")$("#pg").scrollIntoView({behavior:"smooth"});

 if(a!="bag")setOn(a)};
addEventListener("scroll",()=>{if(!$("#q").matches(":focus")&&!showFav)setOn($("#pg").getBoundingClientRect().top<innerHeight*.6?"shop":"home")},{passive:true});
let orders=0,user=null;

<div class="dl"><span class="rk">${ic("truck")}</span><span>Get it Today, 1pm - 7pm</span></div>
<div class="locb" id="dloc"></div><div class="mb" id="dmore"></div></div></div>
<div class="pbar glass"><div class="pp">Price: <b>${R(x.p)}</b></div><div class="pbr"><button class="fvb${fav.has(i)?" on":""}" id="dfav" data-act="fav" aria-label="Favourite">${ic("heart",fav.has(i)?"fill":"")}</button><button class="addg" data-act="add"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10l2-8H7"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/><path d="M12 2v5M9.5 4.5h5"/></svg>Add to Cart</button></div></div>`;
 const drawLoc=()=>{$("#dloc").innerHTML=locEdit?`<input id="li" placeholder="Suburb or city" value="${esc(loc)}"><button class="lk" data-act="locsave">Save</button>`:loc?`<span>${ic("pin")} ${esc(loc)}</span><button class="lk" data-act="loc">Change</button>`:`<span>${ic("pin")} Set your location</span><button class="lk" data-act="loc">Add</button>`};
 const drawMore=()=>{$("#dmore").innerHTML=`<span>FREE Same Day with <b>Velox MORE</b></span><button class="chip" data-act="join">${more?"Joined ✓":"Join"}</button>`};
 locEdit=false;drawLoc();drawMore();
 const sls=pd.querySelector(".sls"),dots=[...pd.querySelectorAll(".dots i")];
 sls.onscroll=()=>{const n=Math.round(sls.scrollLeft/sls.clientWidth);dots.forEach((d,j)=>d.classList.toggle("on",j==n))};
 pd.onclick=e=>{const a=e.target.closest("[data-act]");if(!a)return;const k=a.dataset.act;
  if(k=="back"){pd.classList.remove("on");document.body.style.overflow=""}
  if(k=="cart")open(true);
  if(k=="share"){try{navigator.share&&navigator.share({title:x.n,text:x.n+" – "+R(x.p)+" on Velox",url:location.href}).catch(()=>{})}catch(_){}}
  if(k=="fav"){fav.has(i)?fav.delete(i):fav.add(i);const f=$("#dfav");f.innerHTML=ic("heart",fav.has(i)?"fill":"");f.classList.toggle("on",fav.has(i));grid($("#q").value.toLowerCase());updFav()}
  if(k=="add")busy=busy.then(()=>pack(x));
  if(k=="info"){const n=$("#inote");n.style.display=n.style.display=="none"?"block":"none"}
  if(k=="loc"){locEdit=true;drawLoc()}
  if(k=="locsave"){const v=$("#li").value.trim();if(v)loc=v;locEdit=false;drawLoc()}
  if(k=="join"){more=!more;drawMore()}};
 pd.scrollTop=0;document.body.style.overflow="hidden";
 requestAnimationFrame(()=>requestAnimationFrame(()=>pd.classList.add("on")));
}
function payment(items){
 const t=items.reduce((s,x)=>s+x.p,0),ship=(t>=500||more)?0:60,g=t+ship;
 const m=document.createElement("div");m.className="modal";
 const methods=[["card",ic("card"),"Credit / Debit Card"],["eft",ic("bank"),"Instant EFT"],["cod",ic("cash"),"Pay on Delivery"]];
 let sel="card";
 const draw=()=>{m.innerHTML=`<div class="pay glass"><h2>Choose payment method</h2>
 <div class="sum">${items.length} packed item${items.length>1?"s":""}
 <div><span>Subtotal</span><span>${R(t)}</span></div><div><span>Delivery</span><span>${ship?R(ship):"FREE"}</span></div>
 <div><b>Total</b><b>${R(g)}</b></div></div>
 ${methods.map(([k,i,l])=>`<div class="m ${sel==k?"sel":""}" data-k="${k}"><span style="font-size:22px">${i}</span>${l}</div>`).join("")}
 ${sel=="card"?`<div class="fld"><input placeholder="Card number" inputmode="numeric"><input placeholder="Name on card"><div style="display:flex;gap:8px"><input placeholder="MM/YY"><input placeholder="CVV"></div></div>`:""}
 <button class="btn" id="go">Pay ${R(g)}</button><div class="note">Demo store – no real payment is taken.</div><button class="chip" id="cx" style="display:block;margin:12px auto 0">Back to shop</button></div>`};
 draw();document.body.appendChild(m);
 m.onclick=e=>{const k=e.target.closest(".m");if(k){sel=k.dataset.k;draw()}
  if(e.target.id=="cx")m.remove();
  if(e.target.id=="go"){orderLog.unshift({id:"VLX"+(1001+orderLog.length),items:items.map(x=>x.n),g});cart=[];orders++;render();m.innerHTML=`<div class="pay glass ok"><div class="bg2">${ic("check")}</div><h2>Order confirmed!</h2><p>Your packages are on their way.</p><button class="btn" id="done">Keep shopping</button></div>`}
  if(e.target.id=="done")m.remove()};
}
</script></body></html>
